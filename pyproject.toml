[project]
name = "efficientroute"
version = "0.1.0"
description = "Camera-car coverage planner for the Tbilisi street network"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "osmium>=3.7",
    "shapely>=2.0,<3",
    "geopandas>=1.0,<2",
    "pyproj>=3.6,<4",
    "rasterio>=1.3,<2",
    "networkx>=3.2,<4",
    "scipy>=1.11,<2",
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "folium>=0.17,<1",
    "requests>=2.31,<3",
    "branca>=0.7,<1",
    "ortools>=9.15.6755",
    "highspy>=1.15.1",
    "pymetis>=2025.2.2",
]

[project.scripts]
efficientroute = "efficientroute.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/efficientroute"]
artifacts = ["src/efficientroute/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# src-layout: import the package from source even if the editable install is
# broken (macOS can set UF_HIDDEN on .pth files, which CPython's site.py skips).
pythonpath = ["src"]
markers = [
    "gate: Stage 0 gate assertions; require the built network artifact",
    "gate1: Stage 1 gate assertions; require turn_graph.pkl",
    "gate2: Stage 2 gate assertions; require 02-time-model.json",
    "gate3: Stage 3 gate assertions; require 03-bounds.json",
    "gate4: Stage 4 gate assertions; require 04-zones.json",
    "gate4b: Stage 4b gate assertions; require 04b-recheck.json",
    "gate4c: Stage 4c gate assertions; require 04-zones.json and 05-routes.json",
    "gate5: Stage 5 gate assertions; require 05-routes.json",
    "gate6: Stage 6 gate assertions; coverage tracker and map matcher",
    "gate7: Stage 7 gate assertions; animated playback",
    "gate8: Stage 8 gate assertions; require 08-sequential.json",
    "slow: requires network downloads or full pipeline run",
]
